name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente do build desktop"
        required: true
        default: "production"
        type: choice
        options:
          - homologation
          - production
  push:
    tags:
      - "v*"

jobs:
  build-and-upload:
    runs-on: windows-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

    env:
      BUILD_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      ELECTRON_UPDATE_URL: ${{ vars.ELECTRON_UPDATE_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      VITE_APP_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      VITE_API_URL_AUTH: ${{ vars.VITE_API_URL_AUTH }}
      VITE_API_URL_MRP: ${{ vars.VITE_API_URL_MRP }}
      VITE_API_URL_CONSULTS: ${{ vars.VITE_API_URL_CONSULTS }}
      VITE_DESKTOP_APP_DOWNLOAD_URL: ${{ vars.VITE_DESKTOP_APP_DOWNLOAD_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate update URL
        shell: pwsh
        run: |
          if (-not $env:ELECTRON_UPDATE_URL) {
            throw "Configure a repository variable named ELECTRON_UPDATE_URL with the Azure Static Website desktop URL."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:BUILD_ENV -eq "homologation") {
            npm run desktop:win:homolog
          } else {
            npm run desktop:win:prod
          }

      - name: Upload installer metadata
        run: |
          az storage blob upload-batch --source "release/$env:BUILD_ENV" --destination '$web' --destination-path "desktop/$env:BUILD_ENV" --pattern "latest.yml" --overwrite true --content-type "text/yaml"

      - name: Upload installer executable
        run: |
          az storage blob upload-batch --source "release/$env:BUILD_ENV" --destination '$web' --destination-path "desktop/$env:BUILD_ENV" --pattern "*.exe" --overwrite true --content-type "application/vnd.microsoft.portable-executable"

      - name: Upload differential update blockmap
        run: |
          az storage blob upload-batch --source "release/$env:BUILD_ENV" --destination '$web' --destination-path "desktop/$env:BUILD_ENV" --pattern "*.blockmap" --overwrite true --content-type "application/octet-stream"
